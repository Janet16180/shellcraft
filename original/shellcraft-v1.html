<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shellcraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#14112a; --panel:#1e1a3a; --panel2:#282350; --line:#3a3470;
  --ink:#efe6d2; --dim:#a39fc4; --amber:#ffb347; --rose:#ff5f7e;
  --blue:#6fa8ff; --green:#8ee06a; --magenta:#e37bff; --term:#0d0b1c;
  --display:"Pixelify Sans","Silkscreen",ui-monospace,monospace;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --prose:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--prose);font-size:15px;padding-inline:16px;padding-block:12px;box-sizing:border-box;
  background-image:radial-gradient(circle at 20% 0%,#231d4a 0,transparent 55%),radial-gradient(circle at 90% 100%,#1d1840 0,transparent 50%)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
code,kbd{font-family:var(--mono);font-size:.92em}
code{background:#2e2860;border-radius:3px;padding:1px 5px;color:#ffe2b0}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel2)}

.app{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 14px;background:var(--panel);border:2px solid var(--line);border-radius:6px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--amber);text-shadow:3px 3px 0 #6b2f5a}
.chap{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.chap .eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.chap .name{font-family:var(--display);font-size:18px}
.xp{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.xpbar{flex:1;height:14px;background:#0f0c22;border:2px solid var(--line);position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,var(--green) 0 6px,#6cc24e 6px 8px);transition:width .6s steps(12)}
.xptext{font-family:var(--display);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:4px;color:var(--rose)}
.hearts svg.lost{color:#4a3a5c}
.hud .btn{background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:5px 10px;font-family:var(--display);font-size:13px}
.hud .btn:hover{border-color:var(--amber)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"map term" "panel term";gap:12px}
.mapwrap{grid-area:map;display:flex;flex-direction:column;gap:6px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-family:var(--mono);font-size:13px;color:var(--dim);min-height:22px}
.crumbs button{background:none;border:0;padding:1px 3px;color:var(--blue);font-family:var(--mono);border-radius:3px}
.crumbs button:hover{background:var(--panel2)}
.crumbs .area{margin-left:auto;font-family:var(--display);color:var(--amber);letter-spacing:.05em}
.stage{position:relative;border:3px solid #0a0818;box-shadow:0 0 0 2px var(--line),0 10px 30px rgba(0,0,0,.45);background:#000;line-height:0}
#map{width:100%;height:auto;aspect-ratio:16/10;image-rendering:pixelated;display:block;max-width:100%}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#1b1535ee;border:2px solid var(--amber);color:var(--amber);font-family:var(--display);font-size:14px;line-height:1.3;padding:6px 12px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}

.panelwrap{grid-area:panel;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:6px;min-height:0}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:9px 6px;font-family:var(--display);font-size:14px;color:var(--dim);letter-spacing:.05em}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel2);box-shadow:inset 0 -3px 0 var(--amber)}
.panel{padding:14px 16px;overflow:auto;max-height:380px;line-height:1.55}
.panel h2{font-family:var(--display);font-size:20px;margin:0 0 8px;text-wrap:balance;color:var(--amber)}
.panel p{margin:0 0 10px;max-width:68ch}
.panel ul{margin:0 0 10px;padding-left:20px}
.panel li{margin-bottom:4px}
pre.anat{font-family:var(--mono);font-size:13px;background:var(--term);border:1px solid var(--line);padding:8px 10px;overflow-x:auto;line-height:1.4;margin:0 0 10px;color:var(--ink)}
.warn{color:#ffb0bd}
.tasks{list-style:none;padding:0;margin:12px 0 8px;display:flex;flex-direction:column;gap:6px}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;background:#18142f;border:1px solid var(--line);border-radius:4px;margin:0}
.tasks li .box{flex:none;width:16px;height:16px;border:2px solid var(--dim);margin-top:3px}
.tasks li.done{opacity:.7}
.tasks li.done .box{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 2px #18142f}
.tasks li.done .txt{text-decoration:line-through;text-decoration-color:#6d6a8f}
.tasks li.next{border-color:var(--amber)}
.hintbtn{background:var(--panel2);border:2px solid var(--line);border-radius:4px;padding:5px 10px;font-family:var(--display);font-size:13px}
.hintbtn:hover{border-color:var(--amber)}
.hintout{font-family:var(--mono);font-size:13px;color:var(--amber);margin-top:8px}

.spells{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.spell{background:#18142f;border:1px solid var(--line);border-radius:4px;padding:10px}
.spell h3{margin:0 0 4px;font-family:var(--mono);font-size:16px;color:var(--green)}
.spell p{margin:0 0 6px;font-size:14px}
.spell .ex{display:flex;flex-direction:column;gap:4px}
.chip{display:block;text-align:left;background:var(--term);border:1px solid var(--line);border-radius:3px;padding:3px 7px;font-family:var(--mono);font-size:12.5px;color:#ffe2b0;width:100%}
.chip:hover{border-color:var(--amber)}
.chip small{display:block;color:var(--dim);font-family:var(--prose);font-size:12px}
.spell.locked{opacity:.4}
.levels{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
.levels button{width:100%;display:flex;gap:12px;align-items:center;background:#18142f;border:1px solid var(--line);border-radius:4px;padding:8px 10px;text-align:left}
.levels button:hover:not(:disabled){border-color:var(--amber)}
.levels button:disabled{opacity:.4;cursor:not-allowed}
.levels .num{font-family:var(--display);color:var(--amber);width:28px;font-variant-numeric:tabular-nums}
.levels .st{margin-left:auto;font-size:12px;color:var(--dim)}
.levels .cur{border-color:var(--amber)}

.term{grid-area:term;display:flex;flex-direction:column;background:var(--term);border:3px solid #0a0818;box-shadow:0 0 0 2px var(--line),0 10px 30px rgba(0,0,0,.45);border-radius:6px;min-height:560px;overflow:hidden;position:relative}
.termbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#1a1733;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.termbar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.termbar span{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px;font-family:var(--mono);font-size:14px;line-height:1.45;cursor:text;position:relative}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.ln{white-space:pre-wrap;word-break:break-word;color:#e6e1f5}
.ln.err{color:#ff8fa3}
.ln.note{color:var(--amber);font-style:italic}
.ln.daemon{color:#c79bff;font-weight:600}
.ln.sys{color:var(--dim)}
.ln.chapter{color:var(--amber);font-family:var(--display);font-size:15px;margin:6px 0}
.pu{color:var(--green);font-weight:600}.pp{color:var(--blue);font-weight:600}
.c-dir{color:var(--blue);font-weight:600}.c-exe{color:var(--green);font-weight:600}
.g-file{color:var(--magenta)}.g-num{color:var(--green)}.g-sep{color:#6fd3e0}.g-match{color:#ff5f5f;font-weight:700}
.inputline{display:flex;align-items:baseline;white-space:pre}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#fff;font:inherit;caret-color:var(--amber);padding:0}
.keys{display:none;flex-wrap:wrap;gap:6px;padding:8px;border-top:1px solid var(--line);background:#1a1733}
.keys button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-family:var(--mono);font-size:13px}
@media (pointer:coarse){.keys{display:flex}}

.overlay{position:fixed;inset:0;background:rgba(8,6,20,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px #0a0818,0 20px 60px rgba(0,0,0,.6);border-radius:6px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow:auto;line-height:1.5}
.card .eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card h2{font-family:var(--display);font-size:30px;margin:4px 0 8px;color:var(--amber);text-wrap:balance}
.card h3{font-family:var(--display);font-size:16px;margin:16px 0 6px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.card dt{font-family:var(--mono);color:var(--green);font-size:14px}
.card dd{margin:0;font-size:14px}
.card .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.big{background:var(--amber);color:#2a1300;border:0;border-radius:4px;padding:10px 18px;font-family:var(--display);font-weight:700;font-size:17px;box-shadow:0 4px 0 #b3661d}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #b3661d}
.ghost{background:transparent;border:2px solid var(--line);border-radius:4px;padding:8px 14px;font-family:var(--display);font-size:15px}
.title-logo{font-family:var(--display);font-weight:700;font-size:clamp(44px,11vw,76px);line-height:1;color:var(--amber);text-shadow:4px 4px 0 #6b2f5a,8px 8px 0 #2a1a4a;letter-spacing:.04em;margin:6px 0 10px}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.xpgain{font-family:var(--display);color:var(--green);font-size:20px;margin:0}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "term" "panel"}
  .term{min-height:0;height:68vh}
  .panel{max-height:none}
  .brand{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="hud" id="hud">
    <div class="brand">SHELLCRAFT</div>
    <div class="chap"><span class="eyebrow" id="chapNum">Chapter 1</span><span class="name" id="chapName">The Awakening</span></div>
    <div class="xp"><div class="xpbar"><i id="xpFill"></i></div><span class="xptext" id="xpText">0 XP · Novice</span></div>
    <div class="hearts" id="hearts" aria-label="Hearts"></div>
    <button class="btn" id="soundBtn" type="button">Sound: off</button>
  </header>
  <main class="grid">
    <section class="mapwrap">
      <div class="crumbs" id="crumbs"></div>
      <div class="stage"><canvas id="map" width="640" height="400" aria-label="Map of the current directory"></canvas><div class="toast" id="toast"></div></div>
    </section>
    <section class="panelwrap">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-tab="quest" id="tabbtn-quest">Quest</button>
        <button type="button" role="tab" aria-selected="false" data-tab="spells" id="tabbtn-spells">Spellbook</button>
        <button type="button" role="tab" aria-selected="false" data-tab="levels" id="tabbtn-levels">Chapters</button>
      </nav>
      <div class="panel" id="tab-quest">
        <h2 id="questTitle"></h2>
        <div id="brief"></div>
        <ul class="tasks" id="tasks"></ul>
        <button class="hintbtn" id="hintBtn" type="button">Show hint</button>
        <div class="hintout" id="hintOut"></div>
      </div>
      <div class="panel" id="tab-spells" hidden><div class="spells" id="spells"></div></div>
      <div class="panel" id="tab-levels" hidden><ul class="levels" id="levels"></ul><button class="hintbtn" id="resetBtn" type="button">Reset progress</button></div>
    </section>
    <section class="term" id="term">
      <div class="termbar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span id="termTitle">hero@kernelia: ~</span></div>
      <div class="screen" id="screen"><div id="out"></div><div class="inputline"><span id="prompt"></span><input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input"></div></div>
      <div class="keys" id="keys">
        <button type="button" data-k="Tab">Tab</button><button type="button" data-k="Up">&uarr;</button><button type="button" data-k="Down">&darr;</button>
        <button type="button" data-k="|">|</button><button type="button" data-k="~">~</button><button type="button" data-k="/">/</button><button type="button" data-k="-">-</button><button type="button" data-k=">">&gt;</button><button type="button" data-k="Enter">Enter</button>
      </div>
    </section>
  </main>
</div>
<div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const HOME = '/home/hero';
const GATE = HOME + '/gate/open_gate.sh';
const SCROLL = HOME + '/library/scroll_of_ages.txt';
const KEY = HOME + '/forest/cave/deep/ancient_key.txt';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cmpName = (x, y) => x.replace(/^\./, '').toLowerCase().localeCompare(y.replace(/^\./, '').toLowerCase());

const state = {
  fs: null, cwd: HOME, oldpwd: null, revealed: new Set(), history: [], vars: {},
  aliases: { ll: 'ls -alF', la: 'ls -A' }, procs: [], nextPid: 5012, lastStatus: 0,
  chapter: 0, maxChapter: 0, xp: 0, hearts: 3, done: [], gateOpen: false, sound: false,
};
let lineLog = [], lineEvents = new Set(), lineDanger = [], depth = 0, pipeId = 0;
const ev = name => lineEvents.add(name);
const danger = msg => lineDanger.push(msg);

/* ---------- filesystem ---------- */
const dir = (children = {}, mode = 0o755) => ({ type: 'dir', children, mode, mtime: Date.now() });
const file = (content = '', mode = 0o644) => ({ type: 'file', content, mode, mtime: Date.now() });

function normalize(path, cwd = state.cwd) {
  const parts = (path.startsWith('/') ? path : cwd + '/' + path).split('/');
  const out = [];
  for (const p of parts) {
    if (!p || p === '.') continue;
    if (p === '..') out.pop(); else out.push(p);
  }
  return '/' + out.join('/');
}
function getNode(abs) {
  let n = state.fs;
  if (abs === '/') return n;
  for (const p of abs.split('/').slice(1)) {
    if (!n || n.type !== 'dir') return null;
    n = n.children[p];
  }
  return n || null;
}
const parentOf = abs => { const i = abs.lastIndexOf('/'); return i <= 0 ? '/' : abs.slice(0, i); };
const baseName = abs => abs.slice(abs.lastIndexOf('/') + 1);
const joinPath = (p, n) => p === '/' ? '/' + n : p + '/' + n;
const joinDisp = (d, n) => d === '' ? n : d.endsWith('/') ? d + n : d + '/' + n;
const writable = p => p === HOME || p.startsWith(HOME + '/') || p === '/tmp' || p.startsWith('/tmp/');
const isExe = n => n.type === 'file' && (n.mode & 0o111) !== 0;
const bytes = s => new TextEncoder().encode(s).length;
function putNode(path, node) { getNode(parentOf(path)).children[baseName(path)] = node; }
function dropNode(path) { const par = getNode(parentOf(path)); if (par && par.type === 'dir') delete par.children[baseName(path)]; }
function clone(n) {
  if (n.type === 'file') return { ...n, mtime: Date.now() };
  const c = {};
  for (const k in n.children) c[k] = clone(n.children[k]);
  return { ...n, children: c, mtime: Date.now() };
}
function splitLines(s) {
  if (!s) return [];
  return (s.endsWith('\n') ? s.slice(0, -1) : s).split('\n');
}

/* ---------- world content ---------- */
const TXT = {
  readme: `Dear apprentice,

You have awakened in Kernelia, a world built entirely from files
and directories. Here, commands are spells.

A Shadow Daemon has taken over this machine and is eating all
of its CPU. To stop it you must master the shell, chapter by chapter.

Every directory is a room. Every file is something you can read.
Type 'hint' if you get stuck, or 'man <command>' to study a spell.

    -- The Guardian of Root
`,
  secret: `THE SECRET MAP  (only those who use ls -a can find this)

  ~/forest   a cave hides an ancient key
  ~/junk     clean it up, but save the boots
  ~/library  the Scroll of Ages hides a word of power
  ~/tower    four gems, and one of them is hidden
  ~/market   a messy inventory needs sorting
  ~/gate     sealed until its spell is allowed to execute

The Shadow Daemon lurks in the process table.
`,
  bashrc: `# ~/.bashrc: executed by bash(1) for non-login shells.
alias ll='ls -alF'
alias la='ls -A'
export EDITOR=nano
`,
  key: `    ,o.
   8   8=========
    'o'    ||  ||
The Ancient Key. It hums with power.
Engraved on its side: "Copy me with cp and I will be in two places at once."
`,
  scroll: [
    'THE SCROLL OF AGES', '==================',
    'In the beginning there was only the kernel,', 'and the kernel was silent.',
    'Then came the shell, and with it, the first command.',
    'The first mage typed "ls" and saw the world.',
    'The second mage typed "cd" and walked through it.',
    'The third mage typed "rm -rf /" and was never seen again.',
    '(Learn from the third mage.)',
    'In the Age of Pipes, commands learned to talk to each other.',
    'Output flowed like rivers from one spell into the next.',
    'A dragon slept beneath the Tower of Echoes.',
    'Its name was written in every log file, yet no one could read it.',
    'The scribes wrote everything in plain text,',
    'for plain text is eternal and every tool can read it.',
    'They say the Dragon of /dev/null devours all output sent its way.',
    'Nothing that enters /dev/null ever returns.',
    'The elders kept their secrets in files that began with a dot.',
    'Only those who asked with -a could see them.',
    'Permissions guarded every door: read, write, and execute.',
    'The number 7 meant all three. The number 4 meant only reading.',
    'A wise mage never ran a script they had not read first.',
    'The daemons came later.',
    'Most were friendly: cron kept the time, sshd kept the gates.',
    'But one daemon grew greedy, and devoured the CPU.',
    'The mages called it the Shadow Daemon.',
    'It ignored polite requests to stop.',
    'Only the ninth signal could end it.',
    'The last known dragon sighting was recorded in the syslog.',
    'The Library keeps many more scrolls than this one.',
    'But reading them all from the top would take forever.',
    'That is why the mages invented head and tail.',
    'And why they invented grep, to find one line among thousands.',
    'If you have read this far line by line, you are very patient.',
    'A faster mage would have used tail.',
    'Remember: tail -f follows a file as it grows, perfect for logs.',
    'And less lets you scroll a file one page at a time (q quits).',
    'THE WORD OF POWER IS WRITTEN BELOW.',
    'Speak it with echo, and with nothing else.',
    'Word of power: TUX',
  ].join('\n') + '\n',
  inventory: 'potion\nsword\napple\npotion\nshield\napple\npotion\nmap\nsword\ntorch\napple\ntorch\nrope\npotion\n',
  gate: `#!/bin/bash
# The ancient spell of the Sealed Gate.
echo "The runes on the gate begin to glow..."
echo "*** The Sealed Gate grinds open! ***"
`,
};

const AREAS = {
  forest: () => dir({
    clearing: dir({ 'mushroom.txt': file('A glowing mushroom whispers:\n"Lost? Type pwd. Want to go back up? cd .."\n') }),
    river: dir({ 'fish.txt': file('A fish leaps out of the water and says:\n"Absolute paths start with a slash, like /home/hero/forest/river."\n') }),
    cave: dir({
      'bat.txt': file('A bat squeaks. Deeper still, something glitters...\n(try ls, then cd deep)\n'),
      deep: dir({ 'ancient_key.txt': file(TXT.key) }),
    }),
  }),
  junk: () => dir({

    if (c === '<') { push(); toks.push({ op: '<' }); i++; continue; }

    }
    if (t.op === '>' || t.op === '>>' || t.op === '<') {
      const nx = toks[k + 1];
      if (!nx || nx.op) throw syntax(nx ? nx.op : 'newline');

    }

    }

    const n = getNode(normalize(f));

    if (n.type === 'dir') { errs.push(`${name}: ${f}: Is a directory`); continue; }
    out.push({ label: f, content: n.content });
  }
  return { out, errs };
}

CMD.cat = (a, stdin) => {
  const o = pf('cat', a, 'n');
  if (o.err) return R('', o.err, 1);
  let files = o.rest;
  if (!files.length) { if (stdin == null) return needInput('cat'); files = ['-']; }
  const { out, errs } = readSources('cat', files, stdin);
  let text = out.map(s => s.content).join('');
  if (o.flags.has('n')) {
    const lines = splitLines(text);
    text = lines.map((l, i) => String(i + 1).padStart(6) + '\t' + l).join('\n') + (lines.length ? '\n' : '');
  }
  return R(text, errs.join('\n'), errs.length ? 1 : 0);
};
const pagerNote = name => `A real ${name} opens the file in a scrollable viewer: arrow keys or Space to move, / to search, q to quit. Here it simply prints the file.`;
CMD.less = (a, stdin) => { const r = CMD.cat(a.filter(x => !x.startsWith('-')), stdin); r.note = pagerNote('less'); return r; };
CMD.more = (a, stdin) => { const r = CMD.cat(a.filter(x => !x.startsWith('-')), stdin); r.note = pagerNote('more'); return r; };

CMD.touch = a => {
  const o = pf('touch', a, '');
  if (o.err) return R('', o.err, 1);
  if (!o.rest.length) return R('', "touch: missing file operand\nTry 'touch --help' for more information.", 1);
  const errs = [];
  for (const f of o.rest) {
    const p = normalize(f), n = getNode(p);
    if (n) { n.mtime = Date.now(); continue; }
    const par = getNode(parentOf(p));
    if (!par || par.type !== 'dir') { errs.push(`touch: cannot touch '${f}': No such file or directory`); continue; }
    if (!writable(p)) { errs.push(`touch: cannot touch '${f}': Permission denied`); continue; }
    par.children[baseName(p)] = file('');
  }
  return R('', errs.join('\n'), errs.length ? 1 : 0);
};

CMD.mkdir = a => {
  const o = pf('mkdir', a, 'pv');
  if (o.err) return R('', o.err, 1);
  if (!o.rest.length) return R('', "mkdir: missing operand\nTry 'mkdir --help' for more information.", 1);
  const errs = []; let out = '';
  for (const f of o.rest) {
    const p = normalize(f);
    const existing = getNode(p);
    if (existing) { if (!o.flags.has('p') || existing.type !== 'dir') errs.push(`mkdir: cannot create directory '${f}': File exists`); continue; }
    if (!writable(p)) { errs.push(`mkdir: cannot create directory '${f}': Permission denied`); continue; }
    if (o.flags.has('p')) {

      for (const seg of p.split('/').filter(Boolean)) {

        if (n && n.type !== 'dir') { bad = true; break; }
        if (!n) { getNode(cur).children[seg] = dir(); if (o.flags.has('v')) out += `mkdir: created directory '${f.startsWith('/') || !next.startsWith(state.cwd + '/') ? next : next.slice(state.cwd.length + 1)}'\n`; }
        cur = next;
      }
      if (bad) errs.push(`mkdir: cannot create directory '${f}': Not a directory`);
      continue;
    }
    const par = getNode(parentOf(p));
    if (!par) { errs.push(`mkdir: cannot create directory '${f}': No such file or directory`); continue; }
    if (par.type !== 'dir') { errs.push(`mkdir: cannot create directory '${f}': Not a directory`); continue; }

    if (o.flags.has('v')) out += `mkdir: created directory '${f}'\n`;

};

function leaveIfGone() {
  let p = state.cwd;
  while (!getNode(p)) p = parentOf(p);
  state.cwd = p;
}

CMD.rmdir = a => {
  const o = pf('rmdir', a, 'v');
  if (o.err) return R('', o.err, 1);
  if (!o.rest.length) return R('', "rmdir: missing operand\nTry 'rmdir --help' for more information.", 1);
  const errs = [];
  for (const f of o.rest) {
    const p = normalize(f), n = getNode(p);
    if (/(^|\/)\.$/.test(f)) { errs.push(`rmdir: failed to remove '${f}': Invalid argument`); continue; }
    if (!n) { errs.push(`rmdir: failed to remove '${f}': No such file or directory`); continue; }
    if (n.type !== 'dir') { errs.push(`rmdir: failed to remove '${f}': Not a directory`); continue; }
    if (Object.keys(n.children).length) { errs.push(`rmdir: failed to remove '${f}': Directory not empty`); continue; }
    if (!writable(parentOf(p))) { errs.push(`rmdir: failed to remove '${f}': Permission denied`); continue; }
    dropNode(p);
  }
  leaveIfGone();
  return R('', errs.join('\n'), errs.length ? 1 : 0);
};

CMD.rm = a => {
  const o = pf('rm', a, 'rRfiv');
  if (o.err) return R('', o.err, 1);
  const rec = o.flags.has('r') || o.flags.has('R'), force = o.flags.has('f');
  if (!o.rest.length) return force ? R() : R('', "rm: missing operand\nTry 'rm --help' for more information.", 1);
  const errs = []; let out = '', note = null;
  for (const f of o.rest) {
    const last = f.replace(/\/+$/, '').split('/').pop();
    if (last === '.' || last === '..') { errs.push(`rm: refusing to remove '.' or '..' directory: skipping '${f}'`); continue; }
    const p = normalize(f);
    if (p === '/') {
      if (rec) {
        errs.push("rm: it is dangerous to operate recursively on '/'\nrm: use --no-preserve-root to override this failsafe");
        danger('You tried to erase the whole system. GNU rm refuses by default (--preserve-root). Never try this on a real machine.');
      } else errs.push("rm: cannot remove '/': Is a directory");
      continue;
    }
    const n = getNode(p);
    if (!n) { if (!force) errs.push(`rm: cannot remove '${f}': No such file or directory`); continue; }
    if (n.type === 'dir' && !rec) { errs.push(`rm: cannot remove '${f}': Is a directory`); continue; }
    if (p === HOME) {
      danger('That would erase your entire home directory, and a real rm would do it without asking. The Guardian blocked it this time.');
      continue;
    }
    if (!writable(parentOf(p)) || !writable(p)) { errs.push(`rm: cannot remove '${f}': Permission denied`); continue; }
    dropNode(p);
    if (o.flags.has('v')) out += n.type === 'dir' ? `removed directory '${f}'\n` : `removed '${f}'\n`;
  }
  if (o.flags.has('i')) note = 'In a real terminal, -i asks "rm: remove regular file ...?" and waits for y or n. The game answers yes for you.';
  leaveIfGone();
  const r = R(out, errs.join('\n'), errs.length ? 1 : 0);
  r.note = note;
  return r;
};

function copyOrMove(name, a, move) {
  const o = pf(name, a, move ? 'ivnf' : 'rRivnf');
  if (o.err) return R('', o.err, 1);
  const rest = [...o.rest];
  if (rest.length < 2) {
    return R('', (rest.length ? `${name}: missing destination file operand after '${rest[0]}'` : `${name}: missing file operand`) + `\nTry '${name} --help' for more information.`, 1);
  }
  const dest = rest.pop(), destAbs = normalize(dest), destNode = getNode(destAbs);
  if (rest.length > 1 && (!destNode || destNode.type !== 'dir')) return R('', `${name}: target '${dest}' is not a directory`, 1);
  const rec = o.flags.has('r') || o.flags.has('R');
  const errs = []; let out = '';
  for (const src of rest) {
    const srcAbs = normalize(src), n = getNode(srcAbs);
    if (!n) { errs.push(move ? `mv: cannot stat '${src}': No such file or directory` : `cp: cannot stat '${src}': No such file or directory`); continue; }
    if (!move && n.type === 'dir' && !rec) { errs.push(`cp: -r not specified; omitting directory '${src}'`); continue; }
    const target = destNode && destNode.type === 'dir' ? joinPath(destAbs, baseName(srcAbs)) : destAbs;
    if (target === srcAbs) { errs.push(`${name}: '${src}' and '${dest}' are the same file`); continue; }
    if (n.type === 'dir' && target.startsWith(srcAbs + '/')) {
      errs.push(move ? `mv: cannot move '${src}' to a subdirectory of itself, '${dest}'` : `cp: cannot copy a directory, '${src}', into itself, '${dest}'`);
      continue;
    }
    const par = getNode(parentOf(target));
    if (!par || par.type !== 'dir') {
      errs.push(move ? `mv: cannot move '${src}' to '${dest}': No such file or directory` : `cp: cannot create regular file '${dest}': No such file or directory`);
      continue;
    }
    if (!writable(target) || (move && !writable(srcAbs))) {
      errs.push(move ? `mv: cannot move '${src}' to '${dest}': Permission denied` : `cp: cannot create regular file '${dest}': Permission denied`);
      continue;
    }
    if (srcAbs === HOME) { errs.push(`${name}: cannot move your home directory in this game`); continue; }
    const existing = getNode(target);
    if (existing && existing.type === 'dir' && n.type !== 'dir') { errs.push(`${name}: cannot overwrite directory '${target}' with non-directory`); continue; }
    if (existing && o.flags.has('n')) continue;
    par.children[baseName(target)] = move ? n : clone(n);
    if (move) dropNodeIfSame(srcAbs, n);
    if (o.flags.has('v')) out += move ? `renamed '${src}' -> '${dest}'\n` : `'${src}' -> '${dest}'\n`;
  }
  if (move) leaveIfGone();
  return R(out, errs.join('\n'), errs.length ? 1 : 0);
}
function dropNodeIfSame(path, node) {
  const par = getNode(parentOf(path));
  if (par && par.children[baseName(path)] === node) delete par.children[baseName(path)];

CMD.cp = a => copyOrMove('cp', a, false);
CMD.mv = a => {
  const before = state.cwd, r = copyOrMove('mv', a, true);
  if (!getNode(before)) leaveIfGone();
  return r;
};

CMD.chmod = a => {
  const recursive = a.includes('-R');
  const args = a.filter(x => x !== '-R');
  if (!args.length) return R('', "chmod: missing operand\nTry 'chmod --help' for more information.", 1);
  if (args.length < 2) return R('', `chmod: missing operand after '${args[0]}'\nTry 'chmod --help' for more information.`, 1);
  const [mode, ...files] = args;
  let apply;
  if (/^[0-7]{3,4}$/.test(mode)) {
    const m = parseInt(mode.slice(-3), 8);
    apply = () => m;
  } else {
    const clauses = mode.split(',').map(c => /^([ugoa]*)([+\-=])([rwx]*)$/.exec(c));
    if (clauses.some(c => !c)) return R('', `chmod: invalid mode: '${mode}'\nTry 'chmod --help' for more information.`, 1);
    apply = old => {
      let m = old;
      for (const [, whoRaw, op, perms] of clauses) {
        const who = !whoRaw || whoRaw.includes('a') ? 'ugo' : whoRaw;
        let bits = 0;
        for (const w of who) {
          const shift = { u: 6, g: 3, o: 0 }[w];
          for (const p of perms) bits |= { r: 4, w: 2, x: 1 }[p] << shift;
        }
        if (op === '+') m |= bits;
        else if (op === '-') m &= ~bits;
        else {
          let mask = 0;
          for (const w of who) mask |= 7 << { u: 6, g: 3, o: 0 }[w];
          m = (m & ~mask) | bits;
        }
      }
      return m;
    };
  }
  const errs = [];
  const visit = n => { n.mode = apply(n.mode); if (recursive && n.type === 'dir') Object.values(n.children).forEach(visit); };
  for (const f of files) {
    const p = normalize(f), n = getNode(p);
    if (!n) { errs.push(`chmod: cannot access '${f}': No such file or directory`); continue; }
    if (!writable(p)) { errs.push(`chmod: changing permissions of '${f}': Operation not permitted`); continue; }
    visit(n);
  }
  return R('', errs.join('\n'), errs.length ? 1 : 0);
};

CMD.tree = a => {
  const o = pf('tree', a, 'ad', 'L');
  if (o.err) return R('', o.err, 1);
  const root = o.rest[0] || '.';
  const n = getNode(normalize(root));
  if (!n || n.type !== 'dir') return R(`${root}  [error opening dir]\n\n0 directories, 0 files\n`, '', 2);
  const maxL = o.vals.L ? parseInt(o.vals.L, 10) : Infinity;
  let dirs = 0, files = 0;
  const text = [root], html = [`<span class="c-dir">${esc(root)}</span>`];
  const walk = (node, prefix, level) => {
    if (level > maxL) return;
    const names = Object.keys(node.children)
      .filter(k => (o.flags.has('a') || k[0] !== '.') && (!o.flags.has('d') || node.children[k].type === 'dir'))
      .sort(cmpName);
    names.forEach((k, i) => {
      const c = node.children[k], last = i === names.length - 1;
      const conn = prefix + (last ? '└── ' : '├── ');
      text.push(conn + k); html.push(esc(conn) + nameHTML(k, c, false));
      if (c.type === 'dir') { dirs++; walk(c, prefix + (last ? '    ' : '│   '), level + 1); } else files++;
    });
  };
  walk(n, '', 1);
  const summary = `\n${dirs} director${dirs === 1 ? 'y' : 'ies'}` + (o.flags.has('d') ? '' : `, ${files} file${files === 1 ? '' : 's'}`);
  const r = R(text.join('\n') + '\n' + summary + '\n', '', 0, html.join('\n') + '\n' + summary);
  r.note = 'tree is not always installed by default. On Ubuntu: sudo apt install tree';
  return r;
};
/* ---------- commands: text processing ---------- */
function headTail(which, a, stdin) {
  a = a.flatMap(x => /^-\d+$/.test(x) ? ['-n', x.slice(1)] : [x]);
  const o = pf(which, a, 'qv', 'n');
  if (o.err) return R('', o.err, 1);
  let raw = o.vals.n ?? '10', fromStart = false;
  if (which === 'tail' && raw.startsWith('+')) { fromStart = true; raw = raw.slice(1); }
  if (!/^\d+$/.test(raw)) return R('', `${which}: invalid number of lines: '${o.vals.n}'`, 1);
  const N = parseInt(raw, 10);
  let files = o.rest;
  if (!files.length) { if (stdin == null) return needInput(which); files = ['-']; }
  const errs = [];
  let out = '';
  files.forEach((f, idx) => {
    let content;
    if (f === '-') content = stdin ?? '';
    else {
      const n = getNode(normalize(f));
      if (!n) { errs.push(`${which}: cannot open '${f}' for reading: No such file or directory`); return; }
      if (n.type === 'dir') { errs.push(`${which}: error reading '${f}': Is a directory`); return; }
      content = n.content;
    }
    const lines = splitLines(content);
    let sel;
    if (which === 'head') sel = lines.slice(0, N);
    else if (fromStart) sel = lines.slice(Math.max(0, N - 1));
    else sel = N === 0 ? [] : lines.slice(-N);
    if (files.length > 1) out += (idx ? '\n' : '') + `==> ${f} <==\n`;
    out += sel.map(l => l + '\n').join('');
  });
  return R(out, errs.join('\n'), errs.length ? 1 : 0);
}
CMD.head = (a, s) => headTail('head', a, s);
CMD.tail = (a, s) => {
  const r = headTail('tail', a.filter(x => x !== '-f'), s);
  if (a.includes('-f')) r.note = 'tail -f would keep running and print new lines as the file grows (Ctrl+C stops it). The game prints once.';
  return r;
};

CMD.wc = (a, stdin) => {
  const o = pf('wc', a, 'lwcm');
  if (o.err) return R('', o.err, 1);
  let fields = ['l', 'w', 'c'].filter(k => o.flags.has(k) || (k === 'c' && o.flags.has('m')));
  if (!fields.length) fields = ['l', 'w', 'c'];
  let files = o.rest, fromStdin = false;
  if (!files.length) { if (stdin == null) return needInput('wc'); files = ['-']; fromStdin = true; }
  const { out, errs } = readSources('wc', files, stdin);
  const rows = out.map(s => ({
    label: fromStdin ? '' : s.label,
    l: (s.content.match(/\n/g) || []).length,
    w: s.content.split(/\s+/).filter(Boolean).length,
    c: bytes(s.content),
  }));
  if (rows.length > 1) rows.push({ label: 'total', ...['l', 'w', 'c'].reduce((acc, k) => ({ ...acc, [k]: rows.reduce((t, r) => t + r[k], 0) }), {}) });
  let width = Math.max(1, ...rows.flatMap(r => fields.map(k => String(r[k]).length)));
  if (fields.length === 1 && rows.length === 1) width = 0;
  if (fromStdin && fields.length > 1) width = 7;
  const text = rows.map(r => fields.map(k => String(r[k]).padStart(width)).join(' ') + (r.label ? ' ' + r.label : '')).join('\n');
  return R(text ? text + '\n' : '', errs.join('\n'), errs.length ? 1 : 0);
};

CMD.grep = (a, stdin) => {
  const o = pf('grep', a, 'invcrRlwEHh');
  if (o.err) return R('', o.err.replace("Try 'grep --help'", "Usage: grep [OPTION]... PATTERNS [FILE]...\nTry 'grep --help'"), 2);
  if (!o.rest.length) return R('', "Usage: grep [OPTION]... PATTERNS [FILE]...\nTry 'grep --help' for more information.", 2);
  const f = o.flags;
  const pat = o.rest[0];
  let files = o.rest.slice(1);
  const rec = f.has('r') || f.has('R');
  let src = pat;
  try { new RegExp(src); } catch (e) { src = pat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  if (f.has('w')) src = `\\b(?:${src})\\b`;
  const test = new RegExp(src, f.has('i') ? 'i' : '');
  const hl = new RegExp(src, f.has('i') ? 'gi' : 'g');
  const sources = [], errs = [];
  let defaulted = false;
  if (!files.length) {
    if (rec) { files = ['.']; defaulted = true; }
    else if (stdin == null) return needInput('grep');
    else sources.push({ label: '(standard input)', content: stdin });
  }
  const walk = (node, label) => {
    for (const k of Object.keys(node.children).sort(cmpName)) {
      const c = node.children[k], l = label ? joinDisp(label, k) : k;
      if (c.type === 'dir') walk(c, l); else sources.push({ label: l, content: c.content });
    }
  };
  for (const fl of files) {
    const n = getNode(normalize(fl));
    if (!n) { errs.push(`grep: ${fl}: No such file or directory`); continue; }
    if (n.type === 'dir') {
      if (rec) walk(n, defaulted ? '' : fl);
      else errs.push(`grep: ${fl}: Is a directory`);
      continue;
    }
    sources.push({ label: fl, content: n.content });
  }
  let showName = sources.length > 1 || rec;
  if (f.has('h')) showName = false;
  if (f.has('H')) showName = true;
  const text = [], html = [];
  let any = false;
  for (const s of sources) {
    const lines = splitLines(s.content);
    let count = 0;
    lines.forEach((line, i) => {
      if (test.test(line) === f.has('v')) return;
      count++; any = true;
      if (f.has('c') || f.has('l')) return;
      let t = '', h = '';
      if (showName) { t += s.label + ':'; h += `<span class="g-file">${esc(s.label)}</span><span class="g-sep">:</span>`; }
      if (f.has('n')) { t += (i + 1) + ':'; h += `<span class="g-num">${i + 1}</span><span class="g-sep">:</span>`; }
      t += line;
      h += f.has('v') ? esc(line) : esc(line).replace(new RegExp(hl.source, hl.flags), m => `<span class="g-match">${m}</span>`);
      text.push(t); html.push(h);
    });
    if (f.has('c')) {
      const t = (showName ? s.label + ':' : '') + count;
      text.push(t); html.push(esc(t));
    } else if (f.has('l') && count) {
      text.push(s.label); html.push(`<span class="g-file">${esc(s.label)}</span>`);
    }
  }
  return R(text.length ? text.join('\n') + '\n' : '', errs.join('\n'), errs.length ? 2 : any ? 0 : 1, html.join('\n'));
};

CMD.find = a => {
  let i = 0;
  const paths = [];
  while (i < a.length && !a[i].startsWith('-')) paths.push(a[i++]);
  if (!paths.length) paths.push('.');
  const tests = [];
  let maxDepth = Infinity;
  while (i < a.length) {
    const t = a[i++];
    if (t === '-name' || t === '-iname') {
      const v = a[i++];
      if (v === undefined) return R('', `find: missing argument to \`${t}'`, 1);
      const re = globRe(v, t === '-iname');
      tests.push(e => re.test(e.name));
    } else if (t === '-type') {
      const v = a[i++];
      if (v === undefined) return R('', "find: missing argument to `-type'", 1);
      if (v !== 'f' && v !== 'd') return R('', `find: Unknown argument to -type: ${v}`, 1);
      tests.push(e => e.node.type === (v === 'd' ? 'dir' : 'file'));
    } else if (t === '-maxdepth') {
      const v = a[i++];
      if (!/^\d+$/.test(v || '')) return R('', "find: Expected a positive decimal integer argument to -maxdepth, but got '" + (v || '') + "'", 1);
      maxDepth = parseInt(v, 10);
    } else return R('', `find: unknown predicate \`${t}'`, 1);
  }
  const out = [], errs = [];
  for (const p of paths) {
    const abs = normalize(p), n = getNode(abs);
    if (!n) { errs.push(`find: '${p}': No such file or directory`); continue; }
    const visit = (disp, node, name, d) => {
      if (tests.every(t => t({ name, node }))) out.push(disp);
      if (node.type !== 'dir' || d >= maxDepth) return;
      for (const k of Object.keys(node.children).sort(cmpName)) visit(joinDisp(disp, k), node.children[k], k, d + 1);
    };
    visit(p, n, p === '.' ? '.' : baseName(abs) || '/', 0);
  }
  return R(out.length ? out.join('\n') + '\n' : '', errs.join('\n'), errs.length ? 1 : 0);
};

function linesFrom(name, files, stdin) {
  if (!files.length) {
    if (stdin == null) return { none: true };
    return { lines: splitLines(stdin), errs: [] };
  }
  const { out, errs } = readSources(name, files, stdin);
  return { lines: out.flatMap(s => splitLines(s.content)), errs };
}

CMD.sort = (a, stdin) => {
  const o = pf('sort', a, 'rnuf');
  if (o.err) return R('', o.err, 2);
  const src = linesFrom('sort', o.rest, stdin);
  if (src.none) return needInput('sort');
  let lines = [...src.lines];
  const f = o.flags;
  const cmp = f.has('n')
    ? (x, y) => (parseFloat(x) || 0) - (parseFloat(y) || 0) || x.localeCompare(y)
    : (x, y) => f.has('f') ? x.toLowerCase().localeCompare(y.toLowerCase()) : x.localeCompare(y);
  lines.sort(cmp);
  if (f.has('r')) lines.reverse();
  if (f.has('u')) lines = lines.filter((l, i) => i === 0 || cmp(l, lines[i - 1]) !== 0);
  return R(lines.length ? lines.join('\n') + '\n' : '', src.errs.join('\n').replace(/^sort: (.*): No such file or directory$/gm, 'sort: cannot read: $1: No such file or directory'), src.errs.length ? 2 : 0);
};

CMD.uniq = (a, stdin) => {
  const o = pf('uniq', a, 'cdui');
  if (o.err) return R('', o.err, 1);
  const src = linesFrom('uniq', o.rest.slice(0, 1), stdin);
  if (src.none) return needInput('uniq');
  const same = (x, y) => o.flags.has('i') ? x.toLowerCase() === y.toLowerCase() : x === y;
  const groups = [];
  for (const l of src.lines) {
    const g = groups[groups.length - 1];
    if (g && same(g.line, l)) g.n++; else groups.push({ line: l, n: 1 });
  }
  let sel = groups;
  if (o.flags.has('d')) sel = sel.filter(g => g.n > 1);
  if (o.flags.has('u')) sel = sel.filter(g => g.n === 1);
  const text = sel.map(g => (o.flags.has('c') ? String(g.n).padStart(7) + ' ' : '') + g.line).join('\n');
  return R(text ? text + '\n' : '', src.errs.join('\n'), src.errs.length ? 1 : 0);
};

/* ---------- commands: processes ---------- */
const SIGNALS = { HUP: 1, INT: 2, QUIT: 3, KILL: 9, USR1: 10, USR2: 12, TERM: 15, CONT: 18, STOP: 19 };
function parseSig(s) {
  if (s === undefined) return null;
  if (/^\d+$/.test(s)) { const n = parseInt(s, 10); return n >= 1 && n <= 64 ? n : null; }
  const k = s.toUpperCase().replace(/^SIG/, '');
  return SIGNALS[k] ?? null;
}
function clockTime(t) {
  const [m, s] = t.split(':').map(Number);
  return [Math.floor(m / 60), m % 60, s].map(x => String(x).padStart(2, '0')).join(':');
}
function shortCmd(cmd) {
  const first = cmd.split(' ')[0].replace(/^-/, '');
  return first.startsWith('[') ? cmd : baseName(first);
}

function deliver(proc, sig, errs, how) {
  const tag = how === 'kill' ? `bash: kill: (${proc.pid})` : `${how}: killing pid ${proc.pid} failed`;
  if (proc.user === 'root') { errs.push(how === 'kill' ? `${tag} - Operation not permitted` : `${tag}: Operation not permitted`); return null; }
  if (proc.pid === 733) {
    if (sig === 9) {
      danger('You sent SIGKILL to your own shell. In a real terminal the window would close instantly. The Guardian revived it.');
      return null;
    }
    return 'Interactive bash ignores SIGTERM, so nothing happened. That is why your shell survived.';
  }
  if (proc.pid === DAEMON.pid) {
    if (sig === 9) {
      state.procs = state.procs.filter(p => p !== proc);
      ev('daemonKilled');
      daemonFx('kill');
      return { daemon: '[shadow_daemon] NOOOOO... *the kernel removes the process instantly* (SIGKILL cannot be caught)' };
    }
    if (sig === 19) { proc.stat = 'T'; return 'The daemon is frozen by SIGSTOP but still exists. It could be resumed with SIGCONT. Finish it properly.'; }
    ev('termTried');
    daemonFx('laugh');
    return { daemon: `[shadow_daemon] caught signal ${sig}... ignoring it. You cannot stop me politely!` };
  }
  if ([1, 2, 9, 15].includes(sig)) state.procs = state.procs.filter(p => p !== proc);
  return null;
}
function attachNotes(r, notes) {
  const d = notes.find(n => n && n.daemon);
  const plain = notes.find(n => typeof n === 'string');
  if (d) { r.note = d.daemon; r.noteCls = 'daemon'; }
  else if (plain) r.note = plain;
  return r;
}

CMD.ps = a => {
  let all = false, full = false, user = false;
  for (const x of a) {
    if (x.startsWith('-')) { if (/[eA]/.test(x)) all = true; if (x.includes('f')) full = true; }
    else { if (x.includes('x')) all = true; if (x.includes('u')) user = true; }
  }
  if (all) ev('psAll');
  const self = { pid: state.nextPid++, user: 'hero', cmd: ['ps', ...a].join(' '), tty: 'pts/0', cpu: 0, mem: 0, stat: 'R+', time: '0:00' };
  const list = [...state.procs.filter(p => all || p.tty === 'pts/0'), self].sort((x, y) => x.pid - y.pid);
  let rows;
  if (user) {
    rows = ['USER         PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND'];
    for (const p of list) {
      const vsz = Math.round(8000 + p.mem * 160000), rss = Math.round(1200 + p.mem * 40000);
      rows.push(`${p.user.padEnd(8)} ${String(p.pid).padStart(7)} ${p.cpu.toFixed(1).padStart(4)} ${p.mem.toFixed(1).padStart(4)} ${String(vsz).padStart(6)} ${String(rss).padStart(5)} ${p.tty.padEnd(8)} ${p.stat.padEnd(4)} 09:00 ${p.time.padStart(6)} ${p.cmd}`);
    }
  } else if (full) {
    rows = ['UID          PID    PPID  C STIME TTY          TIME CMD'];
    for (const p of list) {
      const ppid = p.pid === 1 ? 0 : p.pid === 2 ? 0 : p.tty === 'pts/0' && p.pid !== 733 ? 733 : 1;
      rows.push(`${p.user.padEnd(8)} ${String(p.pid).padStart(7)} ${String(ppid).padStart(7)} ${p.cpu > 50 ? '99' : ' 0'} 09:00 ${p.tty.padEnd(8)} ${clockTime(p.time)} ${p.cmd}`);
    }
  } else {
    rows = ['    PID TTY          TIME CMD'];
    for (const p of list) rows.push(`${String(p.pid).padStart(7)} ${p.tty.padEnd(8)} ${clockTime(p.time)} ${shortCmd(p.cmd)}`);
  }
  return R(rows.join('\n') + '\n');
};

CMD.kill = a => {
  if (!a.length) return R('', 'kill: usage: kill [-s sigspec | -n signum | -sigspec] pid | jobspec ... or kill -l [sigspec]', 2);
  if (a[0] === '-l' || a[0] === '-L') {
    return R(' 1) SIGHUP\t 2) SIGINT\t 3) SIGQUIT\t 4) SIGILL\t 5) SIGTRAP\n 6) SIGABRT\t 7) SIGBUS\t 8) SIGFPE\t 9) SIGKILL\t10) SIGUSR1\n11) SIGSEGV\t12) SIGUSR2\t13) SIGPIPE\t14) SIGALRM\t15) SIGTERM\n16) SIGSTKFLT\t17) SIGCHLD\t18) SIGCONT\t19) SIGSTOP\t20) SIGTSTP\n');
  }
  let sig = 15, i = 0;
  if (a[0] === '-s' || a[0] === '-n') { sig = parseSig(a[1]); i = 2; if (sig == null) return R('', `bash: kill: ${a[1]}: invalid signal specification`, 1); }
  else if (a[0].startsWith('-')) { sig = parseSig(a[0].slice(1)); i = 1; if (sig == null) return R('', `bash: kill: ${a[0].slice(1)}: invalid signal specification`, 1); }
  const pids = a.slice(i);
  if (!pids.length) return R('', 'kill: usage: kill [-s sigspec | -n signum | -sigspec] pid | jobspec ... or kill -l [sigspec]', 2);
  const errs = [], notes = [];
  for (const x of pids) {
    if (!/^\d+$/.test(x)) { errs.push(`bash: kill: ${x}: arguments must be process or job IDs`); continue; }
    const proc = state.procs.find(p => p.pid === parseInt(x, 10));
    if (!proc) { errs.push(`bash: kill: (${x}) - No such process`); continue; }
    notes.push(deliver(proc, sig, errs, 'kill'));
  }
  return attachNotes(R('', errs.join('\n'), errs.length ? 1 : 0), notes);
};

function killByName(name, a, exact) {
  let sig = 15;
  const rest = [];
  for (const x of a) {
    if (/^-/.test(x)) { sig = parseSig(x.slice(1).replace(/^-?signal=?/, '')) ?? sig; continue; }
    rest.push(x);
  }
  if (!rest.length) return R('', exact ? 'Usage: killall [OPTION]... [--] NAME...' : "pkill: no matching criteria specified\nTry `pkill --help' for more information.", exact ? 1 : 2);
  const errs = [], notes = [];
  let matched = 0;
  for (const pat of rest) {
    let re;
    try { re = new RegExp(pat); } catch (e) { re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')); }
    const hits = state.procs.filter(p => exact ? shortCmd(p.cmd) === pat : re.test(shortCmd(p.cmd)));
    matched += hits.length;
    if (!hits.length && exact) errs.push(`${pat}: no process found`);
    for (const p of hits) notes.push(deliver(p, sig, errs, name));
  }
  return attachNotes(R('', errs.join('\n'), matched ? 0 : 1), notes);
}
CMD.pkill = a => killByName('pkill', a, false);
CMD.killall = a => killByName('killall', a, true);
CMD.pgrep = a => {
  const pat = a.filter(x => !x.startsWith('-'))[0];
  if (!pat) return R('', 'pgrep: no matching criteria specified', 2);
  const hits = state.procs.filter(p => shortCmd(p.cmd).includes(pat));
  return R(hits.map(p => p.pid).join('\n') + (hits.length ? '\n' : ''), '', hits.length ? 0 : 1);
};

CMD.top = () => {

const F = HOME + '/forest', CAMP = HOME + '/camp', J = HOME + '/junk', G = HOME + '/gate', MK = HOME + '/market';
function makeCtx() {
  const c = {
    stages: lineLog, events: lineEvents, cwd: state.cwd,
    node: getNode,
    ran: (name, pred = () => true) => lineLog.some(s => s.name === name && s.status === 0 && pred(s)),
    flag: (s, ch) => s.args.some(x => /^-[a-zA-Z0-9]+$/.test(x) && x.includes(ch)),
    hasPath: (s, p) => s.args.some(x => !x.startsWith('-') && normalize(x, s.cwd) === p),
    readFile: p => ['cat', 'less', 'more'].some(n => c.ran(n, s => c.hasPath(s, p))),
    nArg: s => {
      for (let i = 0; i < s.args.length; i++) {
        const x = s.args[i];
        if (x === '-n') return parseInt(s.args[i + 1], 10);
        if (/^-n\d+$/.test(x)) return parseInt(x.slice(2), 10);
        if (/^-\d+$/.test(x)) return parseInt(x.slice(1), 10);
      }
      return 10;
    },
    inPipe: s => s.plen > 1,
  };
  return c;
}

function layoutRoom(p) {

  if (!node || node.type !== 'dir') return L;
  const showHidden = state.revealed.has(p);
  const names = Object.keys(node.children).filter(n => showHidden || n[0] !== '.').sort(cmpName);
  const dirs = names.filter(n => node.children[n].type === 'dir');
  const files = names.filter(n => node.children[n].type === 'file');
  const maxD = 7, shown = dirs.length > maxD ? dirs.slice(0, maxD - 1) : dirs;
  const slots = shown.length + (dirs.length > shown.length ? 1 : 0);
  const step = slots ? (320 - 24) / slots : 0;
  shown.forEach((n, i) => {
    const cx = 12 + step * (i + 0.5);
    L.doors.push({ name: n, cx, x: Math.round(cx - 11), y: 18, w: 22, h: 34, path: joinPath(p, n), hidden: n[0] === '.' });
  });
  if (dirs.length > shown.length) L.moreDoors = { n: dirs.length - shown.length, cx: 12 + step * (slots - 0.5) };
  const maxI = 12, fs = files.length > maxI ? files.slice(0, maxI - 1) : files;
  fs.forEach((n, i) => {
    const col = i % 6, row = Math.floor(i / 6);
    const f = node.children[n];
    L.items.push({ name: n, x: 24 + col * 46, y: 64 + row * 44, node: f, hidden: n[0] === '.' });
  });
  if (files.length > fs.length) L.moreItems = files.length - fs.length;
  if (p !== '/') L.exit = { x: 146, y: 186, w: 28, h: 14 };

}

function burst(x, y, colors, n = 24, speed = 1.6) {

function drawParticles() {

    p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life--;

function drawOverlay(L, t) {

function tween(dur, fn) {
  return new Promise(res => {
    if (reduced) { fn(1); res(); return; }
    tweens.push({ t0: performance.now(), dur, fn, res });

function runTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i], p = Math.min(1, (now - tw.t0) / tw.dur);
    tw.fn(p);
    if (p >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}
async function walkTo(x, y, dur) {
  const sx = pl.x, sy = pl.y;
  pl.walking = true;
  await tween(dur, p => { pl.x = sx + (x - sx) * p; pl.y = sy + (y - sy) * p; });
  pl.walking = false;
}

async function travel(from, to) {
  const token = ++travelToken;
  const L = layoutRoom(from);
  const door = L.doors.find(d => d.path === to);
  if (parentOf(to) === from && door) await walkTo(door.cx, 56, 380);
  else if (to === parentOf(from) && L.exit) await walkTo(160, 194, 320);
  else burst(pl.x, pl.y - 12, ['#b59cff', '#ffffff', '#ffd36b'], 30);
  if (token !== travelToken) return;
  await tween(180, p => { fade = p; });
  if (token !== travelToken) return;
  roomPath = to;
  const L2 = layoutRoom(to);
  const back = L2.doors.find(d => d.path === from);
  if (to === parentOf(from) && back) { pl.x = back.cx; pl.y = 56; }
  else if (parentOf(to) === from) { pl.x = 160; pl.y = 198; }
  else { pl.x = 160; pl.y = 178; burst(160, 166, ['#b59cff', '#ffffff', '#ffd36b'], 30); }
  sfx.step();
  await tween(180, p => { fade = 1 - p; });
  if (token !== travelToken) return;
  await walkTo(160, 178, 300);
}

function daemonFx(kind) {
  const t = performance.now();
  if (kind === 'laugh') { daemonView.flash = t + 600; bubble('SIGTERM? I ignore that!', 'daemon'); sfx.err(); }
  if (kind === 'kill') {
    burst((daemonView.x || 262) + 12, (daemonView.y || 70) + 12, ['#3b1d5c', '#ff3355', '#e8d7ff', '#ffd36b'], 70, 2.4);
    daemonView.alive = false;
    shakeScreen();
  }
}

function frame(now) {
  runTweens(now);
  ax.clearRect(0, 0, 320, 200);
  const L = drawRoom(now);
  drawDaemon(now);
  drawPlayer(now);
  drawParticles();
  g.clearRect(0, 0, 640, 400);
  g.drawImage(art, 0, 0, 640, 400);
  drawOverlay(L, now);
  requestAnimationFrame(frame);
}
/* ---------- sound ---------- */
let audio = null;
function beep(freq, dur = 0.08, type = 'square', vol = 0.04, when = 0) {
  if (!state.sound) return;
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), gn = audio.createGain(), t = audio.currentTime + when;
  o.type = type; o.frequency.value = freq;
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(audio.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  key: () => beep(1400, 0.012, 'square', 0.006),
  ok: () => { beep(660, 0.08); beep(990, 0.12, 'square', 0.04, 0.08); },
  err: () => beep(140, 0.15, 'sawtooth', 0.035),
  level: () => [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.16, 'square', 0.045, i * 0.11)),
  hurt: () => { beep(220, 0.1, 'sawtooth', 0.05); beep(110, 0.25, 'sawtooth', 0.05, 0.1); },
  step: () => beep(90, 0.05, 'triangle', 0.05),
};

/* ---------- terminal output ---------- */
const out = $('#out'), screen = $('#screen'), cmdInput = $('#cmd');
function printHTML(html, cls = '') {
  const d = document.createElement('div');
  d.className = 'ln ' + cls;
  d.innerHTML = html;
  out.appendChild(d);
  while (out.childElementCount > 600) out.firstChild.remove();
  screen.scrollTop = screen.scrollHeight;
}
const printText = (t, cls) => printHTML(esc(t), cls);
const displayPath = p => p === HOME ? '~' : p.startsWith(HOME + '/') ? '~' + p.slice(HOME.length) : p;
const promptHTML = () => `<span class="pu">hero@kernelia</span>:<span class="pp">${esc(displayPath(state.cwd))}</span>$ `;
const strip = s => s.endsWith('\n') ? s.slice(0, -1) : s;
const topSink = {
  out: (text, html) => { const t = strip(text); if (t === '' && !html) return; printHTML(html != null ? html.replace(/\n$/, '') : esc(t)); },
  err: t => { printText(t, 'err'); sfx.err(); },
  note: (t, cls) => printText((cls === 'daemon' ? '' : '» ') + t, cls || 'note'),
  clear: () => { out.innerHTML = ''; },
};

/* ---------- HUD and panels ---------- */
const RANKS = [[0, 'Novice'], [100, 'Apprentice'], [250, 'Adept'], [450, 'Shell Mage'], [700, 'Root Wizard']];
const HEART = '<svg viewBox="0 0 7 6" width="21" height="18" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/></svg>';
function rankOf(xp) { let r = RANKS[0]; for (const k of RANKS) if (xp >= k[0]) r = k; return r; }
function renderHUD() {
  const ch = CHAPTERS[state.chapter];
  $('#chapNum').textContent = `Chapter ${state.chapter + 1} of ${CHAPTERS.length}`;
  $('#chapName').textContent = ch.name;
  const [base, title] = rankOf(state.xp);
  const next = RANKS.find(r => r[0] > state.xp);
  $('#xpFill').style.width = next ? `${((state.xp - base) / (next[0] - base)) * 100}%` : '100%';
  $('#xpText').textContent = `${state.xp} XP · ${title}`;
  $('#hearts').innerHTML = [0, 1, 2].map(i => i < state.hearts ? HEART : HEART.replace('<svg', '<svg class="lost"')).join('');
  $('#soundBtn').textContent = `Sound: ${state.sound ? 'on' : 'off'}`;
  $('#prompt').innerHTML = promptHTML();
  $('#termTitle').textContent = `hero@kernelia: ${displayPath(state.cwd)}`;
  renderCrumbs();
}
function renderCrumbs() {
  const el = $('#crumbs');
  const segs = state.cwd.split('/').filter(Boolean);
  let html = `<button type="button" data-cd="/">/</button>`, acc = '';
  segs.forEach((s, i) => { acc += '/' + s; html += `<button type="button" data-cd="${esc(acc)}">${esc(s)}</button>${i < segs.length - 1 ? '/' : ''}`; });
  html += `<span class="area">${esc(BIOMES[biomeFor(state.cwd)].name)}</span>`;
  el.innerHTML = html;
}
function renderQuest() {
  const ch = CHAPTERS[state.chapter], done = state.done[state.chapter] || [];
  $('#questTitle').textContent = `Chapter ${state.chapter + 1}: ${ch.name}`;
  $('#brief').innerHTML = ch.brief;
  const next = ch.tasks.findIndex((t, i) => !done[i]);
  $('#tasks').innerHTML = ch.tasks.map((t, i) => `<li class="${done[i] ? 'done' : i === next ? 'next' : ''}"><span class="box"></span><span class="txt">${esc(t.t)}</span></li>`).join('');
  $('#hintOut').textContent = '';
}
function renderSpells() {
  const reached = state.maxChapter + 1;
  $('#spells').innerHTML = SPELLS.map(([ch, name, sum, ex]) => {
    const locked = ch > reached;
    return `<div class="spell${locked ? ' locked' : ''}"><h3>${esc(name)}</h3><p>${locked ? `Unlocks in chapter ${ch}` : esc(sum)}</p>${locked ? '' : `<div class="ex">${ex.map(([c, m]) => `<button type="button" class="chip" data-ins="${esc(c)}">${esc(c)}${m ? `<small>${esc(m)}</small>` : ''}</button>`).join('')}</div>`}</div>`;
  }).join('');
}
function renderLevels() {
  $('#levels').innerHTML = CHAPTERS.map((c, i) => {
    const doneAll = i < state.maxChapter || (state.done[i] && state.done[i].every(Boolean));
    const st = i === state.chapter ? 'playing' : doneAll ? 'cleared' : i <= state.maxChapter ? 'open' : 'locked';
    return `<li><button type="button" data-ch="${i}" class="${i === state.chapter ? 'cur' : ''}" ${i > state.maxChapter ? 'disabled' : ''}><span class="num">${String(i + 1).padStart(2, '0')}</span><span>${esc(c.name)}</span><span class="st">${st}</span></button></li>`;
  }).join('');
}
function renderAll() { renderHUD(); renderQuest(); renderSpells(); renderLevels(); }

let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}
function shakeScreen() {
  const el = $('#app');
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}

/* ---------- progress ---------- */
const SAVE_KEY = 'shellcraft-save-v1';
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ chapter: state.chapter, maxChapter: state.maxChapter, xp: state.xp, sound: state.sound })); }
  catch (e) { /* storage unavailable: progress lives for this session only */ }
}
function load() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }
  catch (e) { return null; }
}
function gainXP(n) { state.xp += n; renderHUD(); }
function loseHeart(msg) {
  state.hearts--;
  printText('[Guardian] ' + msg, 'note');
  sfx.hurt(); shakeScreen();
  bubble('Ouch!', 'player');
  if (state.hearts <= 0) {
    state.hearts = 3;
    printText('[Guardian] You ran out of hearts. The Guardian of Root restores them. Be careful out there.', 'note');
  }
  renderHUD();
}

function startChapter(i, fresh) {
  state.chapter = i;
  if (fresh) {
    state.fs = buildWorld();
    state.procs = baseProcs();
    state.revealed = new Set();
    state.cwd = HOME; state.oldpwd = null; state.gateOpen = false;
    roomPath = HOME; pl.x = 160; pl.y = 178;
  }
  CHAPTERS[i].setup?.();
  if (!getNode(state.cwd)) { state.cwd = HOME; roomPath = HOME; }
  state.done[i] = CHAPTERS[i].tasks.map(() => false);
  daemonView.alive = state.procs.some(p => p.pid === DAEMON.pid);
  banner = { text: CHAPTERS[i].name.toUpperCase(), sub: `CHAPTER ${i + 1}`, t0: performance.now(), dur: 2800 };
  printText(`── Chapter ${i + 1}: ${CHAPTERS[i].name} ──`, 'chapter');
  printText('Read the Quest panel, then type commands here. Type hint if you get stuck.', 'sys');
  renderAll(); save();
  showTab('quest');
}

function checkTasks() {
  const ch = CHAPTERS[state.chapter], done = state.done[state.chapter];
  const ctx = makeCtx();
  let newly = 0;
  ch.tasks.forEach((t, i) => {
    if (done[i] || !t.ok(ctx)) return;
    done[i] = true; newly++;
    gainXP(10);
    toast(`Quest complete: ${t.t}  +10 XP`);
    burst(pl.x, pl.y - 20, ['#ffd36b', '#9be15d', '#ffffff'], 26);
  });
  if (!newly) return;
  sfx.ok();
  renderQuest();
  if (done.every(Boolean)) setTimeout(chapterComplete, 900);
}

function chapterComplete() {
  const i = state.chapter, ch = CHAPTERS[i];
  gainXP(50);
  state.maxChapter = Math.max(state.maxChapter, Math.min(i + 1, CHAPTERS.length - 1));
  save(); renderSpells(); renderLevels();
  sfx.level();
  burst(160, 100, ['#ffd36b', '#ff5f7e', '#6fa8ff', '#9be15d', '#ffffff'], 90, 2.6);
  const last = i === CHAPTERS.length - 1;
  const recap = `<h3>Spells mastered</h3><dl>${ch.recap.map(([c, m]) => `<dt>${esc(c)}</dt><dd>${esc(m)}</dd>`).join('')}</dl>`;
  if (!last) {
    openCard(`<div class="eyebrow">Chapter ${i + 1} cleared</div><h2>${esc(ch.name)}</h2><p class="xpgain">+50 XP bonus</p>${recap}
      <div class="actions"><button class="big" type="button" id="nextBtn">Continue to chapter ${i + 2}</button><button class="ghost" type="button" id="stayBtn">Keep exploring here</button></div>`);
    $('#nextBtn').onclick = () => { closeCard(); startChapter(i + 1, false); };
    $('#stayBtn').onclick = closeCard;
    $('#nextBtn').focus();
    return;
  }
  const [, title] = rankOf(state.xp);
  openCard(`<div class="eyebrow">The Shadow Daemon is gone</div><h2>You saved Kernelia</h2>
    <p>CPU usage is back to normal. Final rank: <b>${esc(title)}</b> with <b>${state.xp} XP</b>.</p>${recap}
    <h3>Take it to a real terminal</h3>
    <p>Open a real Linux terminal (Ubuntu, WSL, or macOS Terminal) and try:</p>
    <dl><dt>ls -la ~</dt><dd>see your real hidden config files</dd><dt>ps aux --sort=-%cpu | head -n 6</dt><dd>the header plus the five busiest processes</dd><dt>grep -rn "TODO" .</dt><dd>find every TODO in a project</dd><dt>du -sh *</dt><dd>how much space each item uses</dd><dt>history | tail -n 20</dt><dd>your last 20 commands</dd></dl>
    <div class="actions"><button class="big" type="button" id="stayBtn">Keep playing</button></div>`);
  $('#stayBtn').onclick = closeCard;
}

function openCard(html) { $('#card').innerHTML = html; $('#overlay').hidden = false; }
function closeCard() { $('#overlay').hidden = true; cmdInput.focus(); }

/* ---------- running a line ---------- */
let histIdx = 0;
function submit(line) {
  printHTML(promptHTML() + esc(line), 'cmdline');
  if (line.trim()) state.history.push(line);
  histIdx = state.history.length;
  lineLog = []; lineEvents = new Set(); lineDanger = [];
  const before = state.cwd;
  const status = line.trim() ? executeLine(line, topSink) : 0;
  if (status === 127) bubble('?', 'player', 1400);
  lineDanger.forEach(loseHeart);
  if (state.chapter === 4 && !getNode(J + '/old_boots.txt')) {
    if (!getNode(J)) putNode(J, dir({}));
    putNode(J + '/old_boots.txt', file('Worn but sturdy leather boots. Keep these!\n'));
    loseHeart('You threw away the boots! Wildcards like * match everything. The Guardian put them back.');
  }
  if (lineEvents.has('gateOpened')) { burst(160, 40, ['#ffd36b', '#ffffff'], 50, 2); shakeScreen(); }
  if (state.cwd !== before) travel(before, state.cwd);
  checkTasks();
  renderHUD();
  screen.scrollTop = screen.scrollHeight;
}

function commonPrefix(list) {
  let p = list[0];
  for (const s of list) while (!s.startsWith(p)) p = p.slice(0, -1);
  return p;
}
function complete() {
  const v = cmdInput.value;
  const word = /(\S*)$/.exec(v)[1];
  const before = v.slice(0, v.length - word.length);
  const isCmd = !before.trim() || /[|;&]\s*$/.test(before);
  let cands = [];
  if (isCmd && !word.includes('/')) {
    cands = Object.keys(CMD).filter(k => k.startsWith(word)).sort().map(k => ({ text: k + ' ', show: k }));
  } else {
    const slash = word.lastIndexOf('/');
    const dirPart = slash >= 0 ? word.slice(0, slash + 1) : '', base = word.slice(slash + 1);
    const lookup = dirPart.startsWith('~') ? HOME + dirPart.slice(1) : dirPart;
    const n = getNode(normalize(lookup || '.'));
    if (n && n.type === 'dir') {
      cands = Object.keys(n.children).filter(k => k.startsWith(base) && (base.startsWith('.') || k[0] !== '.')).sort(cmpName)
        .map(k => { const c = n.children[k]; return { text: dirPart + k + (c.type === 'dir' ? '/' : ' '), show: k + (c.type === 'dir' ? '/' : '') }; });
    }
  }
  if (!cands.length) return;
  if (cands.length === 1) { cmdInput.value = before + cands[0].text; return; }
  const common = commonPrefix(cands.map(c => c.text));
  if (common.length > word.length) { cmdInput.value = before + common; return; }
  printHTML(promptHTML() + esc(v));
  printText(cands.map(c => c.show).join('  '));
}
function moveCaretEnd() { const n = cmdInput.value.length; requestAnimationFrame(() => cmdInput.setSelectionRange(n, n)); }
function historyStep(dir) {
  if (dir < 0 && histIdx > 0) histIdx--;
  else if (dir > 0 && histIdx < state.history.length) histIdx++;
  cmdInput.value = state.history[histIdx] ?? '';
  moveCaretEnd();
}

cmdInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const v = cmdInput.value; cmdInput.value = ''; submit(v); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); historyStep(-1); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); historyStep(1); return; }
  if (e.key === 'Tab') { e.preventDefault(); complete(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 'c' && cmdInput.selectionStart === cmdInput.selectionEnd) {
    e.preventDefault(); printHTML(promptHTML() + esc(cmdInput.value) + '^C'); cmdInput.value = ''; return;
  }
  if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); out.innerHTML = ''; return; }
  if (e.key.length === 1) sfx.key();
});
screen.addEventListener('click', () => { if (!getSelection().toString()) cmdInput.focus(); });
$('#keys').addEventListener('click', e => {
  const k = e.target.closest('button')?.dataset.k;
  if (!k) return;
  if (k === 'Tab') complete();
  else if (k === 'Up') historyStep(-1);
  else if (k === 'Down') historyStep(1);
  else if (k === 'Enter') { const v = cmdInput.value; cmdInput.value = ''; submit(v); }
  else cmdInput.value += k === '|' || k === '>' ? ` ${k} ` : k;
  cmdInput.focus();
});
function insertCommand(text) { cmdInput.value = text; cmdInput.focus(); moveCaretEnd(); }
$('#crumbs').addEventListener('click', e => { const p = e.target.closest('button')?.dataset.cd; if (p) insertCommand(`cd ${p}`); });
$('#spells').addEventListener('click', e => { const c = e.target.closest('.chip')?.dataset.ins; if (c) insertCommand(c); });
$('#levels').addEventListener('click', e => {
  const b = e.target.closest('button[data-ch]');
  if (!b || b.disabled) return;
  startChapter(parseInt(b.dataset.ch, 10), true);
  out.innerHTML = '';
  printText(`Jumped to chapter ${state.chapter + 1}. The world was reset.`, 'sys');
});
let resetArmed = false;
$('#resetBtn').addEventListener('click', e => {
  if (!resetArmed) { resetArmed = true; e.target.textContent = 'Click again to erase all progress'; return; }
  resetArmed = false; e.target.textContent = 'Reset progress';
  state.xp = 0; state.maxChapter = 0; state.hearts = 3; state.done = [];
  out.innerHTML = '';
  startChapter(0, true);
});
function showTab(name) {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  ['quest', 'spells', 'levels'].forEach(t => { $('#tab-' + t).hidden = t !== name; });
}
document.querySelector('.tabs').addEventListener('click', e => { const t = e.target.closest('button')?.dataset.tab; if (t) showTab(t); });
$('#hintBtn').addEventListener('click', () => {
  const ch = CHAPTERS[state.chapter], done = state.done[state.chapter] || [];
  const i = ch.tasks.findIndex((t, k) => !done[k]);
  $('#hintOut').textContent = i < 0 ? 'Chapter complete.' : 'Try: ' + ch.tasks[i].h;
});
$('#soundBtn').addEventListener('click', () => { state.sound = !state.sound; renderHUD(); save(); sfx.ok(); });

/* ---------- boot ---------- */
function titleScreen() {
  const saved = load();
  if (saved) { state.xp = saved.xp || 0; state.maxChapter = saved.maxChapter || 0; state.sound = !!saved.sound; }
  const cont = saved && (saved.chapter > 0 || saved.xp > 0);
  openCard(`<div class="eyebrow">A terminal adventure</div>
    <div class="title-logo">SHELLCRAFT</div>
    <p>A Shadow Daemon has taken over the machine. Explore a world made of files and directories, cast real Linux commands, and learn the terminal along the way.</p>
    <p>The commands you learn work the same way on a real Linux system, and the output looks the same.</p>
    <div class="actions">
      <button class="big" type="button" id="goBtn">${cont ? `Continue: chapter ${saved.chapter + 1}` : 'Start adventure'}</button>
      ${cont ? '<button class="ghost" type="button" id="newBtn">New game</button>' : ''}
    </div>
    <p class="sys" style="margin-top:14px;color:var(--dim)">Press <kbd>Enter</kbd> to begin<span class="blink">_</span></p>`);
  const go = ch => {
    closeCard();
    out.innerHTML = '';
    printText('Welcome to Kernelia GNU/Linux 6.8.0 (simulated)', 'sys');
    printText('Commands behave like bash on Ubuntu. Type help to see what is available.', 'sys');
    startChapter(ch, true);
    cmdInput.focus();
  };
  $('#goBtn').onclick = () => go(cont ? saved.chapter : 0);
  $('#goBtn').focus();
  if (cont) $('#newBtn').onclick = () => { state.xp = 0; state.maxChapter = 0; go(0); };
}

state.fs = buildWorld();
state.procs = baseProcs();
renderAll();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) document.fonts.load('12px Silkscreen');
titleScreen();
</script>
